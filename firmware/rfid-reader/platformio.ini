; PlatformIO Project Configuration File
; ESP32 RFID Attendance System
;
; Build: pio run
; Upload: pio run --target upload
; Generate .bin: pio run (output in .pio/build/esp32dev/firmware.bin)

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Serial monitor
monitor_speed = 115200

; Partition scheme with OTA support (default with OTA)
board_build.partitions = default.csv

; Upload settings
upload_speed = 921600

; Build flags
build_flags = 
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_CDC_ON_BOOT=0

; Required libraries
lib_deps = 
    miguelbalboa/MFRC522@^1.4.10
    bblanchon/ArduinoJson@^6.21.3
    marcoschwartz/LiquidCrystal_I2C@^1.1.4

; Extra build options for release
build_type = release

; Output firmware.bin to easily accessible location
extra_scripts = post:rename_firmware.py
